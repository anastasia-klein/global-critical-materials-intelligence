version: 2
models:
- name: stg_iea_observations
  description: One native IEA edition/scenario/case/end-use/geography/year record.
    Scale conversion does not establish equivalent basis.
  columns:
  - name: record_id
    description: Deterministic identity of a source observation within a selected
      immutable snapshot.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: request_id
    description: Stable source and canonical-query identity; not a source revision.
    data_type: VARCHAR
  - name: snapshot_id
    description: Request plus original response-byte hash; all source revisions remain
      separately addressable.
    data_type: VARCHAR
  - name: payload_sha256
    description: SHA-256 of the unchanged original source response bytes.
    data_type: VARCHAR
  - name: source_locator
    description: Original IEA array index or Comext JSON-stat value/status offset.
    data_type: VARCHAR
  - name: ingested_at_utc
    description: First ingestion time of this request/payload; replays do not refresh
      it.
    data_type: TIMESTAMP WITH TIME ZONE
  - name: source_release
    description: Native IEA model edition or Comext published revision timestamp.
    data_type: VARCHAR
  - name: edition
    description: Exact IEA model edition; scenarios from different editions must not
      be merged.
    data_type: VARCHAR
  - name: material_definition
    description: 'Exact native IEA definition, including separate Graphite and Graphite:
      all grades.'
    data_type: VARCHAR
  - name: scenario_name
    description: Exact source scenario name; no scenario substitution or cloning.
    data_type: VARCHAR
  - name: case_name
    description: Exact technology/project case, distinct from the scenario.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Base Case
    data_type: VARCHAR
  - name: category
    description: Native Material demand or Material supply category.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Material demand
          - Material supply
    data_type: VARCHAR
  - name: native_flow
    description: Native IDLE demand, Mining or Refining flow; not an inferred trade
      direction.
    data_type: VARCHAR
  - name: geography_native
    description: Unchanged IEA geography label, including World and Other countries.
    data_type: VARCHAR
  - name: end_use_native
    description: Unchanged source product/end-use label; demand end uses must retain
      scope.
    data_type: VARCHAR
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years,
      not interpolated history.
    data_type: INTEGER
  - name: native_unit
    description: Unchanged native unit; inspected IEA values are Thousand tonnes.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - Thousand tonnes
    data_type: VARCHAR
  - name: native_value
    description: Original source numeric observation, nullable; missing is never replaced
      with zero.
    data_type: DOUBLE
  - name: native_scope_tonnes
    description: IEA native value scaled by 1,000 only; the equivalent material basis
      remains unverified.
    data_type: DOUBLE
  - name: quantity_basis
    description: 'Measurement scope: unverified native IEA equivalent or Comext traded
      product mass; never interchangeable.'
    data_type: VARCHAR
  - name: evidence_class
    description: Explicit baseline-unverified, scenario-projection or historical-trade-status-unverified
      class.
    data_type: VARCHAR
  - name: conversion_status
    description: Applied physical scale conversion, separate from semantic equivalence.
    data_type: VARCHAR
- name: stg_comext_cells
  description: One native Comext reporter/partner/product/flow/indicator/year cell;
    sparse absence is not zero.
  columns:
  - name: record_id
    description: Deterministic identity of a source observation within a selected
      immutable snapshot.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: request_id
    description: Stable source and canonical-query identity; not a source revision.
    data_type: VARCHAR
  - name: snapshot_id
    description: Request plus original response-byte hash; all source revisions remain
      separately addressable.
    data_type: VARCHAR
  - name: payload_sha256
    description: SHA-256 of the unchanged original source response bytes.
    data_type: VARCHAR
  - name: source_locator
    description: Original IEA array index or Comext JSON-stat value/status offset.
    data_type: VARCHAR
  - name: ingested_at_utc
    description: First ingestion time of this request/payload; replays do not refresh
      it.
    data_type: TIMESTAMP WITH TIME ZONE
  - name: source_release
    description: Native IEA model edition or Comext published revision timestamp.
    data_type: VARCHAR
  - name: dataset_code
    description: Native Eurostat dataset identifier DS-045409.
    data_type: VARCHAR
  - name: reporter_native
    description: Unchanged source reporter code; approved reporters are DE, FR, IT, ES, PL, NL and EU27_2020
      DE.
    data_type: VARCHAR
  - name: partner_native
    description: Unchanged source partner code; can be a country, territory, special
      code or aggregate.
    data_type: VARCHAR
  - name: reporter_label
    description: Unchanged source reporter label including any historical scope notes.
    data_type: VARCHAR
  - name: partner_label
    description: Unchanged source partner label; it does not establish upstream mine
      origin.
    data_type: VARCHAR
  - name: product_code
    description: Native CN8 commodity code; one selected product form rather than
      a full material basket.
    data_type: VARCHAR
  - name: product_label
    description: Native source product description; annual concordance is not asserted.
    data_type: VARCHAR
  - name: flow_code
    description: 'Native reporting-area direction: 1 import, 2 export.'
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - '1'
          - '2'
    data_type: VARCHAR
  - name: indicator
    description: Native VALUE_IN_EUROS, QUANTITY_IN_100KG or SUPPLEMENTARY_QUANTITY
      indicator.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - VALUE_IN_EUROS
          - QUANTITY_IN_100KG
          - SUPPLEMENTARY_QUANTITY
    data_type: VARCHAR
  - name: frequency
    description: Annual source frequency A; no annual/monthly summation.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - A
    data_type: VARCHAR
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years,
      not interpolated history.
    data_type: INTEGER
  - name: native_value
    description: Original source numeric observation, nullable; missing is never replaced
      with zero.
    data_type: DOUBLE
  - name: source_status
    description: Unchanged observation status, nullable; absent flags do not certify
      an actual measurement.
    data_type: VARCHAR
  - name: source_missingness
    description: Explicit source null or status without value when present; sparse
      absence is not manufactured.
    data_type: VARCHAR
  - name: native_classification
    description: Native CN8 classification; reference-year product identities are
      kept separately.
    data_type: VARCHAR
  - name: classification_status
    description: Annual native product scope retained; longitudinal concordance remains
      unverified.
    data_type: VARCHAR
  - name: evidence_class
    description: Explicit baseline-unverified, scenario-projection or historical-trade-status-unverified
      class.
    data_type: VARCHAR
- name: stg_source_snapshots
  description: One immutable selected source payload including empty responses; original
    timestamps and rights preserved.
  columns:
  - name: snapshot_id
    description: Request plus original response-byte hash; all source revisions remain
      separately addressable.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: source
    description: Source contract name iea or comext.
    data_type: VARCHAR
  - name: request_id
    description: Stable source and canonical-query identity; not a source revision.
    data_type: VARCHAR
  - name: payload_sha256
    description: SHA-256 of the unchanged original source response bytes.
    data_type: VARCHAR
  - name: source_release
    description: Native IEA model edition or Comext published revision timestamp.
    data_type: VARCHAR
  - name: source_release_timestamp
    description: Native published dataset revision time; null when the source did
      not supply one.
    data_type: TIMESTAMP WITH TIME ZONE
  - name: first_retrieved_at_utc
    description: Original first acquisition timestamp from the accepted capture manifest.
    data_type: TIMESTAMP WITH TIME ZONE
  - name: run_id
    description: Complete selected acquisition run; a partial refresh cannot replace
      the warehouse selection.
    data_type: VARCHAR
  - name: validation_status
    description: Accepted or accepted_empty source-contract result; empty does not
      imply zero activity.
    data_type: VARCHAR
  - name: source_observations
    description: Count of native observations returned for the snapshot, including
      explicit null/status cells.
    data_type: INTEGER
  - name: licence_name
    description: Source-specific reuse terms; project code licensing does not replace
      these.
    data_type: VARCHAR
  - name: licence_url
    description: Authoritative source rights/attribution notice URL.
    data_type: VARCHAR
  - name: publication_status
    description: Publication conditions retained from the reviewed source contract.
    data_type: VARCHAR
  - name: request_url
    description: Exact public bounded source request URL, without credentials.
    data_type: VARCHAR
