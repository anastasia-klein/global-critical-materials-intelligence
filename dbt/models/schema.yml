- name: int_trade_flows
  description: One native product-year reporter/partner/flow snapshot with independently
    preserved EUR and 100kg measurements.
  columns:
  - name: snapshot_id
    description: Request plus original response-byte hash; all source revisions remain
      separately addressable.
    data_type: VARCHAR
  - name: request_id
    description: Stable source and canonical-query identity; not a source revision.
    data_type: VARCHAR
  - name: payload_sha256
    description: SHA-256 of the unchanged original source response bytes.
    data_type: VARCHAR
  - name: source_release
    description: Native IEA model edition or Comext published revision timestamp.
    data_type: VARCHAR
  - name: reporter_native
    description: Unchanged source reporter code; approved reporters are DE, FR, IT, ES, PL, NL and EU27_2020
      DE.
    data_type: VARCHAR
  - name: partner_native
    description: Unchanged source partner code; can be a country, territory, special
      code or aggregate.
    data_type: VARCHAR
  - name: reporter_id
    description: Mapped reporter area identity; separate from source code.
    data_type: VARCHAR
  - name: partner_id
    description: Mapped partner area identity; special and aggregate members retain
      distinct identities.
    data_type: VARCHAR
  - name: partner_entity_type
    description: Partner area category; exclude aggregates when summing components.
    data_type: VARCHAR
  - name: reporter_mapping_status
    description: Reviewed source reporter-to-geography mapping rule.
    data_type: VARCHAR
  - name: partner_mapping_status
    description: Reviewed source partner-to-geography mapping rule.
    data_type: VARCHAR
  - name: product_code
    description: Native CN8 commodity code; one selected product form rather than
      a full material basket.
    data_type: VARCHAR
  - name: product_label
    description: Native source product description; annual concordance is not asserted.
    data_type: VARCHAR
  - name: native_classification
    description: Native CN8 classification; reference-year product identities are
      kept separately.
    data_type: VARCHAR
  - name: classification_status
    description: Annual native product scope retained; longitudinal concordance remains
      unverified.
    data_type: VARCHAR
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years,
      not interpolated history.
    data_type: INTEGER
  - name: flow_code
    description: 'Native reporting-area direction: 1 import, 2 export.'
    data_type: VARCHAR
  - name: family_id
    description: Contextual material family identifier; not an additive physical quantity
      definition.
    data_type: VARCHAR
  - name: product_form
    description: Specific traded form such as ore/concentrate, carbonate, oxide or
      finished magnet article.
    data_type: VARCHAR
  - name: definition_scope
    description: Explicit native material/product boundaries and incompatibilities.
    data_type: VARCHAR
  - name: basis
    description: Source-qualified traded-product quantity basis; not contained metal.
    data_type: VARCHAR
  - name: concordance_status
    description: Annual classification correspondence remains unverified; no predecessor
      product is spliced.
    data_type: VARCHAR
  - name: evidence_class
    description: Explicit baseline-unverified, scenario-projection or historical-trade-status-unverified
      class.
    data_type: VARCHAR
  - name: ingested_at_utc
    description: First ingestion time of this request/payload; replays do not refresh
      it.
    data_type: TIMESTAMP WITH TIME ZONE
  - name: trade_value_eur
    description: Native trade value in EUR for the selected product/reporter/partner/period/direction.
    data_type: DOUBLE
  - name: native_quantity_100kg
    description: Native Comext mass indicator; one unit represents 100 kg of the traded
      product.
    data_type: DOUBLE
  - name: supplementary_quantity
    description: Native supplementary observation when supplied; missing remains null
      and no generic mass conversion is permitted.
    data_type: DOUBLE
  - name: value_record_id
    description: Nullable original EUR-cell record ID; absence is not zero.
    data_type: VARCHAR
  - name: quantity_record_id
    description: Nullable original 100kg-cell record ID; absence is not zero.
    data_type: VARCHAR
  - name: supplementary_record_id
    description: Nullable original supplementary-cell record ID; absence is not zero.
    data_type: VARCHAR
  - name: value_source_status
    description: Unchanged source status for the EUR cell, nullable.
    data_type: VARCHAR
  - name: quantity_source_status
    description: Unchanged source status for the 100kg quantity cell, nullable.
    data_type: VARCHAR
  - name: supplementary_source_status
    description: Unchanged supplementary-cell source status; no generic mass unit
      inferred.
    data_type: VARCHAR
  - name: source_cell_count
    description: Number of native indicator cells retained in this trade-flow pivot;
      duplicates are independently tested.
    data_type: BIGINT
  - name: product_mass_tonnes
    description: Comext native 100kg quantity multiplied by 0.1; not contained metal
      mass.
    data_type: DOUBLE
  - name: quantity_basis
    description: 'Measurement scope: unverified native IEA equivalent or Comext traded
      product mass; never interchangeable.'
    data_type: VARCHAR
