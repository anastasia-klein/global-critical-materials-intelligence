- name: fct_ingestion_coverage
  description: One selected request snapshot; zero observations means absent source
    data, not zero market activity.
  columns:
  - name: coverage_key
    description: Selected source snapshot identity, including empty requests.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: run_id
    description: Complete selected acquisition run; a partial refresh cannot replace
      the warehouse selection.
    data_type: VARCHAR
  - name: source
    description: Source contract name iea or comext.
    data_type: VARCHAR
  - name: request_id
    description: Stable source and canonical-query identity; not a source revision.
    data_type: VARCHAR
  - name: source_release
    description: Native IEA model edition or Comext published revision timestamp.
    data_type: VARCHAR
  - name: source_observations
    description: Count of native observations returned for the snapshot, including
      explicit null/status cells.
    data_type: INTEGER
  - name: validation_status
    description: Accepted or accepted_empty source-contract result; empty does not
      imply zero activity.
    data_type: VARCHAR
  - name: first_retrieved_at_utc
    description: Original first acquisition timestamp from the accepted capture manifest.
    data_type: TIMESTAMP WITH TIME ZONE
  - name: source_release_timestamp
    description: Native published dataset revision time; null when the source did
      not supply one.
    data_type: TIMESTAMP WITH TIME ZONE
  - name: empty_source_response
    description: True for a validated empty source response, not an estimated zero.
    data_type: BOOLEAN
  - name: coverage_state
    description: Native observations available or no observations returned; never
      zero-market-activity inference.
    data_type: VARCHAR
- name: dq_observation_issues
  description: Blocking structural anomalies requiring reference or source review;
    expected to contain zero rows.
  columns:
  - name: source_record_id
    description: Deterministic original record identity retained for native lineage.
    data_type: VARCHAR
  - name: source
    description: Source contract name iea or comext.
    data_type: VARCHAR
  - name: issue_code
    description: Blocking structural reference, unit or sign anomaly requiring review.
    data_type: VARCHAR
- name: dq_semantic_gates
  description: Visible unresolved interpretation gates; populated counts are limitations,
    not data-quality pass scores.
  columns:
  - name: source
    description: Source contract name iea or comext.
    data_type: VARCHAR
  - name: gate
    description: Unresolved measurement/interpretation limitation; not a composite
      risk score.
    data_type: VARCHAR
  - name: affected_records
    description: Number of source/fact records subject to this specific semantic gate.
    data_type: BIGINT
  - name: required_policy
    description: Restriction to retain when consuming the affected records.
    data_type: VARCHAR
