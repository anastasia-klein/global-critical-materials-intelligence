    data_type: VARCHAR
  - name: product_key
    description: CN8 plus native product code plus reference-year identity.
    data_type: VARCHAR
  - name: reporter_key
    description: Reporting geography role key.
    data_type: VARCHAR
  - name: partner_key
    description: Trade partner geography role key, including flagged aggregates/special
      categories.
    data_type: VARCHAR
  - name: period_key
    description: Annual reference-period identity.
    data_type: VARCHAR
  - name: source_release_key
    description: Source plus native compilation edition/revision identity.
    data_type: VARCHAR
  - name: quality_state
    description: Structural validation state; valid records may still have unresolved
      semantic gates.
    data_type: VARCHAR
- name: dim_material
  description: Contextual material families; a common family never authorises adding
    incompatible quantities.
  columns:
  - name: material_key
    description: Contextual material-family key. This is not evidence that quantities
      can be added across definitions.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: family_id
    description: Contextual material family identifier; not an additive physical quantity
      definition.
    data_type: VARCHAR
  - name: material_family
    description: Contextual material family label; compatible native definitions/products
      remain separate.
    data_type: VARCHAR
  - name: definition_note
    description: Non-additivity and scope note for the contextual family.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: dim_material_definition
  description: Seven distinct native IEA definitions, including separate graphite
    scopes.
  columns:
  - name: material_definition_key
    description: Exact native IEA definition key; graphite scopes remain distinct.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: material_key
    description: Contextual material-family key. This is not evidence that quantities
      can be added across definitions.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_material')
          field: material_key
    data_type: VARCHAR
  - name: native_material
    description: Exact IEA material definition, not a harmonised all-forms material
      total.
    data_type: VARCHAR
  - name: definition_scope
    description: Explicit native material/product boundaries and incompatibilities.
    data_type: VARCHAR
  - name: quantity_basis
    description: 'Measurement scope: unverified native IEA equivalent or Comext traded
      product mass; never interchangeable.'
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: dim_geography
  description: Canonical ISO country/territory areas and distinct source aggregates,
    residuals and special trade categories.
  columns:
  - name: geography_key
    description: Canonical ISO or source-qualified area key; entity_type controls
      aggregation.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: geography_id
    description: Canonical ISO area or source-qualified aggregate/residual/special-area
      identifier.
    data_type: VARCHAR
  - name: canonical_name
    description: Reference geography name; native source labels remain in mapping/staging.
    data_type: VARCHAR
  - name: iso_alpha2
    description: ISO 3166 alpha-2 when assigned; Namibia NA is preserved, special/residual
      categories remain null.
    data_type: VARCHAR
  - name: iso_alpha3
    description: ISO 3166 alpha-3 when assigned; no invented code for Kosovo, World
      or residuals.
    data_type: VARCHAR
  - name: entity_type
    description: Country_or_territory, world, residual, regional aggregate, special
      partner or source geopolitical area.
    data_tests:
    - not_null
    - accepted_values:
        arguments:
          values:
          - country_or_territory
          - world
          - residual
          - regional_aggregate
          - special_trade_partner
          - geopolitical_area
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: dim_period
  description: Annual reference periods derived from native source years, including
    sparse future model years.
  columns:
  - name: period_key
    description: Annual reference-period identity.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years,
      not interpolated history.
    data_type: INTEGER
  - name: period_start
    description: Derived January 1 boundary of an annual reference period; not an
      observation timestamp.
    data_type: DATE
  - name: period_end
    description: Derived December 31 boundary of an annual reference period; not an
      observation timestamp.
    data_type: DATE
  - name: frequency
    description: Annual source frequency A; no annual/monthly summation.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: dim_scenario
  description: IEA edition plus exact scenario plus case, with an explicit not-applicable
    member.
  columns:
  - name: scenario_key
    description: Composite source edition/scenario/case identity; never omit scenario
      during aggregation.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: edition
    description: Exact IEA model edition; scenarios from different editions must not
      be merged.
    data_type: VARCHAR
  - name: scenario_name
    description: Exact source scenario name; no scenario substitution or cloning.
    data_type: VARCHAR
  - name: case_name
    description: Exact technology/project case, distinct from the scenario.
    data_type: VARCHAR
  - name: scenario_kind
    description: Scenario model member or explicit not_applicable member.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: dim_end_use
  description: Native demand end-use categories; not geographic consumption segments.
  columns:
  - name: end_use_key
    description: Native demand end-use identity.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: end_use_name
    description: Native IEA demand end-use category.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: dim_supply_chain_stage
  description: Mining and refining expected-output stages; not capacity measures.
  columns:
  - name: stage_key
    description: Mining/refining output-stage identity.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: stage_code
    description: Mining or refining expected-output stage; not nameplate capacity.
    data_type: VARCHAR
  - name: stage_name
    description: Mining or Refining source stage label.
    data_type: VARCHAR
  - name: measure_kind
    description: Expected output rather than nameplate capacity.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: dim_trade_flow
  description: Native import/export direction from the selected reporting-area perspective.
  columns:
  - name: flow_key
    description: Native import/export direction identity.
    data_tests:
    - unique
    - not_null
    data_type: VARCHAR
  - name: flow_code
    description: 'Native reporting-area direction: 1 import, 2 export.'
    data_type: VARCHAR
  - name: flow_name
    description: Import or Export from the reporter perspective.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: dim_product
  description: Native CN8 product and reference-year scope; annual concordance is
    not asserted.
  columns:
  - name: product_key
    description: CN8 plus native product code plus reference-year identity.
    data_tests:
    - unique
