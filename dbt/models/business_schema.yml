version: 2
models:
- name: int_analysis_context
  description: One complete selected snapshot-set fingerprint, including empty snapshots; acquisition run identifiers
    are not used as data-version identities.
  columns:
  - name: source_selection_key
    description: Deterministic surrogate identity of the full documented model grain.
    data_type: VARCHAR
    data_tests:
    - unique
    - not_null
  - name: selected_snapshot_count
    description: Number of selected request snapshots, including empty responses.
    data_type: INTEGER
- name: int_trade_measures
  description: One trade fact × value/mass basis. Keeps aggregate partner rows for explicit World denominators and
    separate native indicator lineage.
  columns:
  - name: trade_flow_key
    description: Snapshot/reporter/partner/product/reference-year/flow identity; independent indicator cells are
      preserved.
    data_type: VARCHAR
  - name: material_key
    description: Contextual material-family key. This is not evidence that quantities can be added across definitions.
    data_type: VARCHAR
  - name: product_key
    description: CN8 plus native product code plus reference-year identity.
    data_type: VARCHAR
  - name: reporter_key
    description: Reporting geography role key.
    data_type: VARCHAR
  - name: partner_key
    description: Trade partner geography role key, including flagged aggregates/special categories.
    data_type: VARCHAR
  - name: period_key
    description: Annual reference-period identity.
    data_type: VARCHAR
  - name: flow_key
    description: Native import/export direction identity.
    data_type: VARCHAR
  - name: source_release_key
    description: Source plus native compilation edition/revision identity.
    data_type: VARCHAR
  - name: snapshot_key
    description: Request plus original-byte-hash lineage key, including empty responses.
    data_type: VARCHAR
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years, not interpolated history.
    data_type: INTEGER
  - name: partner_entity_type
    description: Partner area category; exclude aggregates when summing components.
    data_type: VARCHAR
  - name: evidence_class
    description: Explicit baseline-unverified, scenario-projection or historical-trade-status-unverified class.
    data_type: VARCHAR
  - name: product_code
    description: Native CN8 commodity code; one selected product form rather than a full material basket.
    data_type: VARCHAR
  - name: classification_status
    description: Annual native product scope retained; longitudinal concordance remains unverified.
    data_type: VARCHAR
  - name: partner_name
    description: Canonical display name for the source-qualified reported partner.
    data_type: VARCHAR
  - name: partner_iso_alpha2
    description: Reviewed ISO alpha-2 where assigned; geopolitical areas can remain null.
    data_type: VARCHAR
  - name: flow_name
    description: Reporting-perspective import or export direction.
    data_type: VARCHAR
  - name: measure_basis
    description: 'Separate measure family: trade_value in EUR, product_mass in product tonnes, or explicitly labelled
      native scenario output; never sum across bases.'
    data_type: VARCHAR
  - name: measure_unit
    description: Unit matching the measure basis; native scenario tonnes retain unverified equivalent basis.
    data_type: VARCHAR
  - name: measure_value
    description: Native trade indicator after documented scale conversion, without inferring missing values.
    data_type: DOUBLE
  - name: source_status
    description: Original source status for this indicator; null means no supplied status, not certified observed
      actual.
    data_type: VARCHAR
  - name: source_record_id
    description: Deterministic original record identity retained for native lineage.
    data_type: VARCHAR
  - name: reporter_id
    data_type: VARCHAR
    description: Source-mapped reporting country or fixed EU27_2020 aggregate.
  - name: partner_geography_id
    data_type: VARCHAR
    description: Source-qualified partner identity; aggregates remain separate from countries.
  - name: trade_scope
    data_type: VARCHAR
    description: National all partners versus EU27_2020 external partners only.
  - name: denominator_partner_id
    data_type: VARCHAR
    description: WORLD for national reporters; COMEXT:EXT_EU27_2020 for the EU bloc.
  - name: partner_scope_eligible
    data_type: BOOLEAN
    description: EU27_2020 member partners excluded from bloc external metrics; raw records retained.
- name: int_trade_denominators
  description: Reporter × annual product × flow × snapshot × measure. Selects native World and reconciles eligible
    bilateral amounts; no aggregate double counting.
  columns:
  - name: material_key
    description: Contextual material-family key. This is not evidence that quantities can be added across definitions.
    data_type: VARCHAR
  - name: product_key
    description: CN8 plus native product code plus reference-year identity.
    data_type: VARCHAR
  - name: reporter_key
    description: Reporting geography role key.
    data_type: VARCHAR
  - name: period_key
    description: Annual reference-period identity.
    data_type: VARCHAR
  - name: flow_key
    description: Native import/export direction identity.
    data_type: VARCHAR
  - name: source_release_key
    description: Source plus native compilation edition/revision identity.
    data_type: VARCHAR
  - name: snapshot_key
    description: Request plus original-byte-hash lineage key, including empty responses.
    data_type: VARCHAR
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years, not interpolated history.
    data_type: INTEGER
  - name: product_code
    description: Native CN8 commodity code; one selected product form rather than a full material basket.
    data_type: VARCHAR
  - name: classification_status
    description: Annual native product scope retained; longitudinal concordance remains unverified.
    data_type: VARCHAR
  - name: flow_name
    description: Reporting-perspective import or export direction.
    data_type: VARCHAR
  - name: measure_basis
    description: 'Separate measure family: trade_value in EUR, product_mass in product tonnes, or explicitly labelled
      native scenario output; never sum across bases.'
    data_type: VARCHAR
  - name: measure_unit
    description: Unit matching the measure basis; native scenario tonnes retain unverified equivalent basis.
    data_type: VARCHAR
  - name: denominator_row_count
    description: Count of native total rows matching the scoped denominator; exactly one required for eligible metrics.
    data_type: INTEGER
  - name: reference_total
    description: 'Native scoped denominator: World for national reporters, Extra EU27_2020 for the EU bloc. Never
      relabel Extra-EU as World.'
    data_type: DOUBLE
  - name: named_partner_total
    description: Sum of reported country/territory and explicitly typed geopolitical partner values; World and regional/special
      aggregates excluded.
    data_type: DOUBLE
  - name: reported_special_partner_total
    description: Reported special trade partner amount, separately disclosed; it is not assigned to a named supplier.
    data_type: DOUBLE
  - name: missing_named_measure_count
    description: Reported named-partner rows lacking this measure; never converted to zero.
    data_type: INTEGER
  - name: flagged_measure_count
    description: Number of source measure rows with a non-null source status; not a quality certification.
    data_type: INTEGER
  - name: negative_measure_count
    description: Source measure rows below zero; invalidate this denominator rather than dropping the offending
      rows.
    data_type: INTEGER
  - name: native_reconciliation_delta
    description: Native World minus named partner sum, retaining floating-point discrepancies before tolerance handling.
    data_type: DOUBLE
  - name: numeric_tolerance
    description: 'Engineering-only tolerance: max(0.01 EUR or 0.000001 product tonnes, absolute World times 1e-9).
      No economic materiality threshold is inferred.'
    data_type: DOUBLE
  - name: denominator_status
    description: Availability reason after checking one positive World row, nonnegative detail and reconciliation
      within numeric tolerance.
    data_type: VARCHAR
  - name: unallocated_amount
    description: World less known partner amounts, with numerical noise within tolerance represented as zero. Unknown/residual
      shares remain unassigned.
    data_type: DOUBLE
  - name: denominator_scope
    description: Explicit denominator population or aggregate scope. Scenario panel sums and reported-end-use sums
      do not certify independent World totals.
    data_type: VARCHAR
  - name: trade_scope
    data_type: VARCHAR
    description: Country versus bloc external trade population.
  - name: denominator_partner_id
    data_type: VARCHAR
    description: 'Native total used: World or Extra EU27_2020; not a sum of overlapping aggregates.'
- name: int_outlook_series
  description: Definition × geography × edition/scenario/case × year × series kind × optional stage/end use × source
    snapshot/basis. Returned end-use sums and supply panel totals are labelled explicitly.
  columns:
  - name: material_key
    description: Contextual material-family key. This is not evidence that quantities can be added across definitions.
    data_type: VARCHAR
  - name: material_definition_key
    description: Exact native IEA definition key; graphite scopes remain distinct.
    data_type: VARCHAR
  - name: geography_key
    description: Canonical ISO or source-qualified area key; entity_type controls aggregation.
    data_type: VARCHAR
  - name: scenario_key
    description: Composite source edition/scenario/case identity; never omit scenario during aggregation.
    data_type: VARCHAR
  - name: stage_key
    description: Mining/refining output-stage identity.
    data_type: VARCHAR
  - name: end_use_key
    description: Native demand end-use identity.
    data_type: VARCHAR
  - name: source_release_key
    description: Source plus native compilation edition/revision identity.
    data_type: VARCHAR
  - name: snapshot_key
    description: Request plus original-byte-hash lineage key, including empty responses.
    data_type: VARCHAR
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years, not interpolated history.
    data_type: INTEGER
  - name: quantity_basis
    description: 'Measurement scope: unverified native IEA equivalent or Comext traded product mass; never interchangeable.'
    data_type: VARCHAR
  - name: evidence_class
    description: Explicit baseline-unverified, scenario-projection or historical-trade-status-unverified class.
    data_type: VARCHAR
  - name: series_kind
    description: Native end-use demand, sum of returned demand end uses, or expected supply panel output. These
      series are not interchangeable.
    data_type: VARCHAR
  - name: denominator_scope
    description: Explicit denominator population or aggregate scope. Scenario panel sums and reported-end-use sums
      do not certify independent World totals.
    data_type: VARCHAR
  - name: native_scope_tonnes
    description: Native quantity scaled to tonnes within the exact definition. Unverified equivalent basis remains
      attached.
    data_type: DOUBLE
  - name: source_observation_count
    description: Count of native observations contributing to this point; no missing end uses or countries fabricated.
    data_type: INTEGER
  - name: missing_value_count
    description: Count of source observations without a value; blocks aggregate growth if nonzero.
    data_type: INTEGER
  - name: category_set_key
    description: Exact end-use membership fingerprint; supply aggregate uses a declared country-plus-residual scope
      whose internal membership may change.
    data_type: VARCHAR
- name: mart_trade_partner_shares
  description: One eligible reported partner × annual product × reporter × flow × snapshot × measure × source selection;
    denominator is source World including intra-EU trade.
  columns:
  - name: partner_share_key
    description: Deterministic surrogate identity of the full documented model grain.
    data_type: VARCHAR
    data_tests:
