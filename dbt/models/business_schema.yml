    description: 'Conservative HHI lower bound on the 0–1 scale: sum of squared known shares; unresolved residual
      is infinitely dispersed.'
    data_type: DOUBLE
  - name: hhi_upper
    description: Conservative HHI upper bound on the 0–1 scale. Supply Other countries is additional to named countries;
      unallocated trade may augment the largest known supplier, adding 2*largest_share*residual_share as well as
      residual_share squared.
    data_type: DOUBLE
  - name: top3_share_lower
    description: Conservative top-3 share lower bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: top3_share_upper
    description: Conservative top-3 share upper bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: top5_share_lower
    description: Conservative top-5 share lower bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
