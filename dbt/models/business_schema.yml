      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: metric_status
    description: Exact captured panel, residual-bounded estimate or unavailable panel. Does not certify observed
      production.
    data_type: VARCHAR
