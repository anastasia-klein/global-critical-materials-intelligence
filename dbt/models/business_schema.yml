  - name: source_release_key
    description: Source plus native compilation edition/revision identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_source_release')
          field: source_release_key
  - name: snapshot_key
    description: Request plus original-byte-hash lineage key, including empty responses.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_snapshot')
          field: snapshot_key
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years, not interpolated history.
    data_type: INTEGER
  - name: product_code
    description: Native CN8 commodity code; one selected product form rather than a full material basket.
    data_type: VARCHAR
  - name: flow_name
    description: Reporting-perspective import or export direction.
    data_type: VARCHAR
  - name: partner_name
    description: Canonical display name for the source-qualified reported partner.
    data_type: VARCHAR
  - name: partner_iso_alpha2
    description: Reviewed ISO alpha-2 where assigned; geopolitical areas can remain null.
    data_type: VARCHAR
  - name: partner_entity_type
    description: Partner area category; exclude aggregates when summing components.
    data_type: VARCHAR
  - name: measure_basis
    description: 'Separate measure family: trade_value in EUR, product_mass in product tonnes, or explicitly labelled
      native scenario output; never sum across bases.'
    data_type: VARCHAR
  - name: measure_unit
    description: Unit matching the measure basis; native scenario tonnes retain unverified equivalent basis.
    data_type: VARCHAR
  - name: measure_value
    description: Native trade indicator after documented scale conversion, without inferring missing values.
    data_type: DOUBLE
  - name: source_status
    description: Original source status for this indicator; null means no supplied status, not certified observed
      actual.
    data_type: VARCHAR
  - name: source_record_id
    description: Deterministic original record identity retained for native lineage.
    data_type: VARCHAR
  - name: evidence_class
    description: Explicit baseline-unverified, scenario-projection or historical-trade-status-unverified class.
    data_type: VARCHAR
  - name: reference_total
    description: 'Native scoped denominator: World for national reporters, Extra EU27_2020 for the EU bloc. Never
      relabel Extra-EU as World.'
    data_type: DOUBLE
  - name: unallocated_amount
    description: World less known partner amounts, with numerical noise within tolerance represented as zero. Unknown/residual
      shares remain unassigned.
    data_type: DOUBLE
  - name: denominator_scope
    description: Explicit denominator population or aggregate scope. Scenario panel sums and reported-end-use sums
      do not certify independent World totals.
    data_type: VARCHAR
  - name: denominator_status
    description: Availability reason after checking one positive World row, nonnegative detail and reconciliation
      within numeric tolerance.
    data_type: VARCHAR
  - name: classification_status
    description: Annual native product scope retained; longitudinal concordance remains unverified.
    data_type: VARCHAR
  - name: partner_share
    description: Reported bilateral partner amount divided by native World, separately by measure. Null when unavailable.
    data_type: DOUBLE
  - name: reported_partner_rank
    description: Deterministic amount rank among reported named partners, descending with key tie break; null for
      a missing measure. Not a claim of unique economic leadership.
    data_type: INTEGER
  config:
    contract:
      enforced: true
- name: mart_country_material_dependency
  description: Reporter × annual product × import snapshot × measure × source selection. Contains supplier-exposure
    bounds; consumption-based import dependency stays unavailable.
  columns:
  - name: dependency_key
    description: Deterministic surrogate identity of the full documented model grain.
    data_type: VARCHAR
    data_tests:
    - unique
    - not_null
  - name: source_selection_key
    description: MD5 of the ordered complete selected snapshot-ID set. Changes when any selected source snapshot
      changes; replay of identical snapshots retains identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('int_analysis_context')
          field: source_selection_key
  - name: material_key
    description: Contextual material-family key. This is not evidence that quantities can be added across definitions.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_material')
          field: material_key
  - name: product_key
    description: CN8 plus native product code plus reference-year identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_product')
          field: product_key
  - name: reporter_key
    description: Reporting geography role key.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_geography')
          field: geography_key
  - name: period_key
    description: Annual reference-period identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_period')
          field: period_key
  - name: source_release_key
    description: Source plus native compilation edition/revision identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_source_release')
          field: source_release_key
  - name: snapshot_key
    description: Request plus original-byte-hash lineage key, including empty responses.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_snapshot')
          field: snapshot_key
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years, not interpolated history.
    data_type: INTEGER
  - name: product_code
    description: Native CN8 commodity code; one selected product form rather than a full material basket.
    data_type: VARCHAR
  - name: measure_basis
    description: 'Separate measure family: trade_value in EUR, product_mass in product tonnes, or explicitly labelled
      native scenario output; never sum across bases.'
    data_type: VARCHAR
  - name: measure_unit
    description: Unit matching the measure basis; native scenario tonnes retain unverified equivalent basis.
    data_type: VARCHAR
  - name: reference_total
    description: 'Native scoped denominator: World for national reporters, Extra EU27_2020 for the EU bloc. Never
      relabel Extra-EU as World.'
    data_type: DOUBLE
  - name: named_partner_total
    description: Sum of reported country/territory and explicitly typed geopolitical partner values; World and regional/special
      aggregates excluded.
    data_type: DOUBLE
  - name: reported_special_partner_total
    description: Reported special trade partner amount, separately disclosed; it is not assigned to a named supplier.
    data_type: DOUBLE
  - name: unallocated_amount
    description: World less known partner amounts, with numerical noise within tolerance represented as zero. Unknown/residual
      shares remain unassigned.
    data_type: DOUBLE
  - name: native_reconciliation_delta
    description: Native World minus named partner sum, retaining floating-point discrepancies before tolerance handling.
    data_type: DOUBLE
  - name: numeric_tolerance
    description: 'Engineering-only tolerance: max(0.01 EUR or 0.000001 product tonnes, absolute World times 1e-9).
      No economic materiality threshold is inferred.'
    data_type: DOUBLE
  - name: missing_named_measure_count
    description: Reported named-partner rows lacking this measure; never converted to zero.
    data_type: INTEGER
  - name: flagged_measure_count
    description: Number of source measure rows with a non-null source status; not a quality certification.
    data_type: INTEGER
  - name: reported_named_partner_count
    description: Count of returned named partner rows, not a claim that absent partners have zero trade.
    data_type: INTEGER
  - name: denominator_scope
    description: Explicit denominator population or aggregate scope. Scenario panel sums and reported-end-use sums
      do not certify independent World totals.
    data_type: VARCHAR
  - name: denominator_status
    description: Availability reason after checking one positive World row, nonnegative detail and reconciliation
      within numeric tolerance.
    data_type: VARCHAR
  - name: classification_status
    description: Annual native product scope retained; longitudinal concordance remains unverified.
    data_type: VARCHAR
  - name: largest_named_partner_key
    description: A maximum-amount reported named partner; deterministic key tie break. Does not assign unknown residual
      to a country.
    data_type: VARCHAR
  - name: unallocated_share
    description: Unallocated amount divided by native World. Kept outside named supplier ranks.
    data_type: DOUBLE
  - name: hhi_lower
    description: 'Conservative HHI lower bound on the 0–1 scale: sum of squared known shares; unresolved residual
      is infinitely dispersed.'
    data_type: DOUBLE
  - name: hhi_upper
    description: Conservative HHI upper bound on the 0–1 scale. Supply Other countries is additional to named countries;
      unallocated trade may augment the largest known supplier, adding 2*largest_share*residual_share as well as
      residual_share squared.
    data_type: DOUBLE
  - name: top_supplier_share_lower
    description: Conservative top-1 share lower bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: top_supplier_share_upper
    description: Conservative top-1 share upper bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: top3_share_lower
    description: Conservative top-3 share lower bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: top3_share_upper
    description: Conservative top-3 share upper bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: top5_share_lower
    description: Conservative top-5 share lower bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: top5_share_upper
    description: Conservative top-5 share upper bound, on the 0–1 scale. Lower uses largest known shares. Supply
      upper permits one additional residual country; trade upper adds unresolved mass to the leading known suppliers,
      capped at one.
    data_type: DOUBLE
  - name: named_leader_guaranteed
    description: Whether the largest known amount is at least second-largest known plus the entire unallocated amount.
      Unknown trade can augment an existing supplier; ties are permitted.
    data_type: BOOLEAN
  - name: evidence_class
    description: Explicit baseline-unverified, scenario-projection or historical-trade-status-unverified class.
    data_type: VARCHAR
  - name: import_dependency
    description: Unavailable consumption-based import dependency. Always null until compatible domestic output and
      consumption exist.
    data_type: DOUBLE
  - name: import_dependency_status
    description: Explicit missing-input reason; supplier concentration must never substitute for import dependency.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: mart_european_trade_analysis
