        arguments:
          to: ref('dim_supply_chain_stage')
          field: stage_key
  - name: measure_basis
    description: 'Separate measure family: trade_value in EUR, product_mass in product tonnes, or explicitly labelled
      native scenario output; never sum across bases.'
    data_type: VARCHAR
  - name: quantity_basis
    description: 'Measurement scope: unverified native IEA equivalent or Comext traded product mass; never interchangeable.'
    data_type: VARCHAR
  - name: denominator_scope
    description: Explicit denominator population or aggregate scope. Scenario panel sums and reported-end-use sums
      do not certify independent World totals.
    data_type: VARCHAR
  - name: component_name
    description: Individually inspectable concentration, growth or unavailable dependency/gap/capacity component;
      no composite weighting.
    data_type: VARCHAR
  - name: component_unit
    description: HHI on 0–1 scale, fraction, or explicitly labelled native-scope tonnes. Values across components
      are not additive.
    data_type: VARCHAR
  - name: component_value
    description: Exact native-scope metric when available; null for a residual-bounded metric or unavailable component.
    data_type: DOUBLE
  - name: component_lower
    description: Conservative lower bound, or point value for an available exact native-scope calculation; null
      when unavailable.
    data_type: DOUBLE
  - name: component_upper
    description: Conservative upper bound, or point value for an available exact native-scope calculation; null
      when unavailable.
    data_type: DOUBLE
  - name: availability
    description: available, bounded or unavailable; bounded is not a fabricated point estimate.
    data_type: VARCHAR
    data_tests:
    - accepted_values:
        arguments:
          values:
          - available
          - bounded
          - unavailable
  - name: availability_reason
    description: Machine-readable reason describing the applicable measurement contract or unavailable inputs.
    data_type: VARCHAR
  - name: evidence_class
    description: Explicit baseline-unverified, scenario-projection or historical-trade-status-unverified class.
    data_type: VARCHAR
  - name: lineage_snapshot_key
    description: Immutable source snapshot supporting this risk component, including unavailable-input context.
    data_type: VARCHAR
  - name: comparison_kind
    description: Level component with no growth horizon, or growth from native 2025 baseline; different horizons
      remain separate risk records.
    data_type: VARCHAR
  - name: comparison_contract_key
    description: Deterministic identity of comparison kind, base/end years, stage, measure/basis and denominator
      scope; retained in risk grain.
    data_type: VARCHAR
  - name: composite_risk_score
    description: Always null. No arbitrary weighting, normalisation or risk thresholds are introduced.
    data_type: DOUBLE
  - name: risk_policy
    description: Components remain unweighted and separately inspectable; no composite or unsupported high/medium/low
      bands.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
- name: mart_supplier_basis_sensitivity
  description: Reporter × annual product × snapshot × source selection; compares mass/value HHI intervals and leading
    named suppliers without mixing units.
  columns:
  - name: sensitivity_key
    description: Deterministic surrogate identity of the full documented model grain.
    data_type: VARCHAR
    data_tests:
    - unique
    - not_null
  - name: source_selection_key
    description: MD5 of the ordered complete selected snapshot-ID set. Changes when any selected source snapshot
      changes; replay of identical snapshots retains identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('int_analysis_context')
          field: source_selection_key
  - name: material_key
    description: Contextual material-family key. This is not evidence that quantities can be added across definitions.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_material')
          field: material_key
  - name: product_key
    description: CN8 plus native product code plus reference-year identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_product')
          field: product_key
  - name: reporter_key
    description: Reporting geography role key.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_geography')
          field: geography_key
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years, not interpolated history.
    data_type: INTEGER
  - name: snapshot_key
    description: Request plus original-byte-hash lineage key, including empty responses.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_snapshot')
          field: snapshot_key
  - name: value_hhi_lower
    description: EUR supplier HHI lower bound for the same annual product and reporter.
    data_type: DOUBLE
  - name: value_hhi_upper
    description: EUR supplier HHI upper bound including unresolved residual concentration.
    data_type: DOUBLE
  - name: mass_hhi_lower
    description: Product-mass supplier HHI lower bound for the same annual product and reporter.
    data_type: DOUBLE
  - name: mass_hhi_upper
    description: Product-mass supplier HHI upper bound including unresolved residual concentration.
    data_type: DOUBLE
  - name: mass_minus_value_hhi_lower
    description: 'Mass HHI lower bound minus value HHI upper bound: conservative lower bound of basis sensitivity.'
    data_type: DOUBLE
  - name: mass_minus_value_hhi_upper
    description: 'Mass HHI upper bound minus value HHI lower bound: conservative upper bound of basis sensitivity.'
    data_type: DOUBLE
  - name: value_largest_named_partner_key
    description: Largest known supplier key under the labelled measure basis, with deterministic tie break; not
      an origin or ownership claim.
    data_type: VARCHAR
  - name: mass_largest_named_partner_key
    description: Largest known supplier key under the labelled measure basis, with deterministic tie break; not
      an origin or ownership claim.
    data_type: VARCHAR
  - name: sensitivity_result
    description: Whether mass or value HHI is higher under every residual allocation, or ordering remains unresolved/unavailable.
    data_type: VARCHAR
  - name: same_guaranteed_leading_partner
    description: Known leading partner matches across bases when each leader is guaranteed against its residual;
      null otherwise. Ties are not excluded.
    data_type: BOOLEAN
  - name: sensitivity_scope
    description: Sensitivity compares value and mass within one product/year, with all trade partners included in
      the World denominator.
    data_type: VARCHAR
  - name: external_reconciliation_caveat
    description: Explicit unresolved G04 cobalt external-quantity discrepancy; this caveat does not assert all products
      have the same discrepancy.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
