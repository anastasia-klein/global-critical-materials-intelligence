    description: Evidence class of the comparison baseline, retained separately from the endpoint.
    data_type: VARCHAR
  - name: base_category_set_key
    description: Baseline end-use membership fingerprint used to block changed-category aggregate growth.
    data_type: VARCHAR
  - name: base_missing_value_count
    description: Baseline missing source-component count; a nonzero value blocks growth.
    data_type: INTEGER
  - name: base_observation_count
    description: Number of source observations contributing to the baseline point.
    data_type: INTEGER
  - name: growth_status
    description: Availability of native-scope growth after baseline, horizon, positive-base, missingness and category-set
      checks.
    data_type: VARCHAR
  - name: comparison_contract_key
    description: Deterministic identity of comparison kind, base/end years, stage, measure/basis and denominator
      scope; retained in risk grain.
    data_type: VARCHAR
  - name: growth_fraction
    description: Endpoint divided by matched positive 2025 baseline minus one. Fraction, not percentage points;
      unavailable on baseline rows.
    data_type: DOUBLE
  - name: cagr_fraction
    description: 'Annualised native-scope growth: (end/base)^(1/(end year-base year))-1; sparse reference years
      are not interpolated.'
    data_type: DOUBLE
  - name: measure_unit
    description: Unit matching the measure basis; native scenario tonnes retain unverified equivalent basis.
    data_type: VARCHAR
  - name: physical_supply_demand_gap
    description: Always null because matched primary requirements and verified equivalent basis are not available.
    data_type: DOUBLE
  - name: physical_gap_status
    description: Reason physical shortage/surplus is unavailable; total demand is not substituted for primary requirements.
    data_type: VARCHAR
  - name: nameplate_capacity
    description: Always null; source expected output is not a capacity series.
    data_type: DOUBLE
  - name: capacity_status
    description: Reason nameplate-capacity level/growth is unavailable.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
