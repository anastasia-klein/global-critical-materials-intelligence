  - name: product_key
    description: CN8 plus native product code plus reference-year identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_product')
          field: product_key
  - name: reporter_key
    description: Reporting geography role key.
    data_type: VARCHAR
    data_tests:
    - relationships:
