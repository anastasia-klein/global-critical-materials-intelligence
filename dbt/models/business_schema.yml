    contract:
      enforced: true
- name: mart_supplier_composition_changes
  description: Reporter × adjacent base/end annual product keys × partner × measure × both snapshots × source selection.
    Diagnostic same-code share changes require unverified continuity; absent partners stay missing.
  columns:
  - name: composition_change_key
    description: Deterministic surrogate identity of the full documented model grain.
    data_type: VARCHAR
    data_tests:
    - unique
    - not_null
  - name: product_code
    description: Native CN8 commodity code; one selected product form rather than a full material basket.
    data_type: VARCHAR
  - name: reporter_key
    description: Reporting geography role key.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_geography')
          field: geography_key
  - name: measure_basis
    description: 'Separate measure family: trade_value in EUR, product_mass in product tonnes, or explicitly labelled
      native scenario output; never sum across bases.'
    data_type: VARCHAR
  - name: base_year
    description: Explicit comparison baseline year; growth uses the native 2025 baseline whose observed/estimated
      status remains unverified.
    data_type: INTEGER
  - name: end_year
    description: Explicit comparison endpoint year; composition comparisons require adjacent calendar years.
    data_type: INTEGER
  - name: base_product_key
    description: Native CN8 and reference-year product key on the base side; continuity across years is unverified.
    data_type: VARCHAR
  - name: end_product_key
    description: Native CN8 and reference-year product key on the end side; continuity across years is unverified.
    data_type: VARCHAR
  - name: base_snapshot_key
    description: Immutable source snapshot for the base side of this comparison.
    data_type: VARCHAR
  - name: end_snapshot_key
    description: Immutable source snapshot for the end side of this comparison.
    data_type: VARCHAR
  - name: source_selection_key
    description: MD5 of the ordered complete selected snapshot-ID set. Changes when any selected source snapshot
      changes; replay of identical snapshots retains identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('int_analysis_context')
          field: source_selection_key
  - name: base_reference_total
    description: Base-year native World total for the same product code and measure.
    data_type: DOUBLE
  - name: end_reference_total
    description: End-year native World total for the same product code and measure.
    data_type: DOUBLE
  - name: partner_key
    description: Trade partner geography role key, including flagged aggregates/special categories.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_geography')
          field: geography_key
  - name: base_share
    description: Reported partner share in the base-year product scope; null if partner or measure is absent.
    data_type: DOUBLE
  - name: end_share
    description: Reported partner share in the end-year product scope; null if partner or measure is absent.
    data_type: DOUBLE
  - name: base_amount
    description: Reported comparison-base partner amount or scenario amount in the explicit measure unit.
    data_type: DOUBLE
  - name: end_amount
    description: Reported comparison-end partner amount in the same declared measure basis.
    data_type: DOUBLE
  - name: conditional_share_change_pp
    description: 100 times end share minus base share only when both are reported. Diagnostic conditional on unverified
      same-CN8 continuity; not a verified trend.
    data_type: DOUBLE
  - name: presence_pattern
    description: Both reported, base-only reported or end-only reported. Query absence is not market entry or exit.
    data_type: VARCHAR
  - name: comparison_status
    description: Explicit availability/comparability condition for this comparison, including unverified annual
      classification continuity.
    data_type: VARCHAR
  - name: verified_share_change_pp
    description: Always null while annual CN concordance is unverified; conditional diagnostics are kept separately.
    data_type: DOUBLE
  - name: entry_exit_status
    description: Market entry/exit is not established from source-query presence alone.
    data_type: VARCHAR
  config:
    contract:
      enforced: true
