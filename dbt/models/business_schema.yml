  - name: period_key
    description: Annual reference-period identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_period')
          field: period_key
  - name: source_release_key
    description: Source plus native compilation edition/revision identity.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_source_release')
          field: source_release_key
  - name: snapshot_key
    description: Request plus original-byte-hash lineage key, including empty responses.
    data_type: VARCHAR
    data_tests:
    - relationships:
        arguments:
          to: ref('dim_snapshot')
          field: snapshot_key
  - name: reference_year
    description: Native calendar reference year; forecasts are sparse model years, not interpolated history.
    data_type: INTEGER
  - name: product_code
    description: Native CN8 commodity code; one selected product form rather than a full material basket.
    data_type: VARCHAR
  - name: measure_basis
    description: 'Separate measure family: trade_value in EUR, product_mass in product tonnes, or explicitly labelled
      native scenario output; never sum across bases.'
    data_type: VARCHAR
  - name: measure_unit
    description: Unit matching the measure basis; native scenario tonnes retain unverified equivalent basis.
    data_type: VARCHAR
  - name: classification_status
    description: Annual native product scope retained; longitudinal concordance remains unverified.
    data_type: VARCHAR
  - name: imports
    description: Source World imports for a valid measure denominator, in the selected basis and annual product
      scope.
    data_type: DOUBLE
  - name: exports
    description: Source World exports for a valid measure denominator, in the selected basis and annual product
      scope.
    data_type: DOUBLE
  - name: import_unallocated_amount
    description: Unallocated import amount relative to the source World row.
    data_type: DOUBLE
  - name: export_unallocated_amount
    description: Unallocated export amount relative to the source World row.
    data_type: DOUBLE
  - name: flagged_measure_count
    description: Number of source measure rows with a non-null source status; not a quality certification.
    data_type: INTEGER
  - name: valid_flow_count
    description: Count of valid import/export denominators; both are required for trade balance.
    data_type: INTEGER
  - name: trade_balance
    description: Source World exports minus imports, within one annual product and measure scope. CIF/FOB and re-export
      limitations remain.
