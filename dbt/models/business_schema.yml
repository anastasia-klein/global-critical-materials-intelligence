    current acquired reporters are DE, FR, IT, ES, PL, NL and EU27_2020.
  columns:
  - name: trade_analysis_key
    description: Deterministic surrogate identity of the full documented model grain.
    data_type: VARCHAR
    data_tests:
    - unique
    - not_null
  - name: source_selection_key
